<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The reset link carries a token in the URL: never send it as a Referer to other sites. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Rondo: club knowledge, in play." />
    <title>Rondo</title>
    <!-- Applies the theme before the first paint (no flash). Keep identical to `themeInitScript` in @repo/ui/theme. -->
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("rondo-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
