name: CI

# Gates that need no infrastructure: lint, types, build and the unit tests with coverage floors.
# The integration and E2E suites need Docker (Postgres, Weaviate) and still run locally
# (`bun run test:integration`, `bun run test:e2e`; see .docs/QA.md §3).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Types
        run: bun run check-types

      - name: Build
        run: bun run build

      # Same tests as `bun run test`, plus the coverage floors in each vitest config.
      - name: Unit tests with coverage
        run: bun run test:coverage
