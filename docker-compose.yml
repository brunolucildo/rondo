name: rondo

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rondo
      POSTGRES_USER: rondo_migrator
      POSTGRES_PASSWORD: rondo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rondo_migrator -d rondo"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Banco vetorial dos experts (spec 0022, ADR "Weaviate com multi-tenancy por usuario").
  # Versao fixada; sem modulos vetorizadores (a API calcula os vetores); so API key, sem acesso
  # anonimo; portas so em 127.0.0.1. A chave padrao e so de desenvolvimento local.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.40.5
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      CLUSTER_HOSTNAME: node1
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      API_BASED_MODULES_DISABLED: "true"
      AUTOSCHEMA_ENABLED: "false"
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "false"
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-rondo-dev-weaviate-key}
      AUTHENTICATION_APIKEY_USERS: rondo-api
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - tempo
      - mimir
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  loki:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/loki:latest
    image: rondo/loki-toolbox:local
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  tempo:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/tempo:latest
    image: rondo/tempo-toolbox:local
    command: -config.file=/etc/tempo/tempo.yaml
    ports:
      - "3200:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  mimir:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: grafana/mimir:latest
    image: rondo/mimir-toolbox:local
    command:
      - -config.file=/etc/mimir/mimir.yaml
      - -target=all
    ports:
      - "9009:9009"
    volumes:
      - ./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:9009/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  otel-collector:
    build:
      context: ./infra/docker
      dockerfile: Dockerfile.toolbox
      args:
        BASE_IMAGE: otel/opentelemetry-collector-contrib:latest
    image: rondo/otel-collector-toolbox:local
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      POSTGRES_ENDPOINT: ${POSTGRES_ENDPOINT:-postgres:5432}
      POSTGRES_USER: ${POSTGRES_USER:-rondo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rondo}
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - loki
      - tempo
      - mimir
      - postgres
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
  grafana-data:
  loki-data:
  tempo-data:
  mimir-data:
  weaviate-data:
